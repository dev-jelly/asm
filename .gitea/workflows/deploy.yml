# App builds run on Gitea; GitHub only publishes prebuilt files to Pages.
name: Deploy to GitHub Pages
'on':
  push: {}
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - name: Audit production dependencies
      run: npm audit --omit=dev
    - name: Report full dependency audit
      run: npm audit --audit-level=critical
    - run: npm run typecheck
    - run: npm run lint
    - run: npm run test:unit
    timeout-minutes: 60
  build:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - run: npm run build
    - run: npm run test:rendered
    - run: npx playwright install --with-deps chromium
    - run: npm run test:e2e
    - name: Store verified static site
      uses: actions/upload-artifact@v4
      with:
        name: static-site
        path: ./dist/client
        include-hidden-files: true
        retention-days: 14
    - name: Publish prebuilt files to the existing GitHub Pages site
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      env:
        CI_PUBLISH_TOKEN: ${{ secrets.CI_PUBLISH_TOKEN }}
        SITE_DIRECTORY: dist/client
      run: bash .gitea/scripts/publish-pages.sh
    timeout-minutes: 60
